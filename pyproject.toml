[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gtfo-probe"
version = "0.1.0"
description = "Sandboxed prober that discovers which flags turn 'read-only' CLIs into file writers, executors or network clients."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []            # standard library only, on purpose (see docs/DESIGN.md)

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
gtfo-probe = "gtfo_probe.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gtfo_probe = ["probes/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["sandbox: needs a working bubblewrap sandbox (skipped when unavailable)"]
